[package]
name = "hd-devstack"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Local mainnet-fork dev stack for Heads Down: genesis surgery, ORE round driver, heads_down init and the phone-less end-to-end smoke"
publish = false

# Standalone workspace, like every other Rust package in this monorepo (no root Cargo.toml).
[workspace]

[[bin]]
name = "hd-devstack"
path = "src/main.rs"

[dependencies]
# The crank's library: RPC client, sender, ORE/heads_down layouts, PDAs, events.
hd-crank = { path = "../../../crank" }
# The program crate as a host library: the exact ORE layout hash initialize_config requires.
heads-down = { path = "../../../programs/heads-down/program", features = ["no-entrypoint"] }
p256-introspect = { path = "../../../crates/p256-introspect", features = ["client"] }

tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# The process-wide TLS provider for keyed https RPCs (same crate and features as hd-crank).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

solana-address = { version = "2.7", features = ["curve25519", "decode"] }
solana-hash = "4"
solana-instruction = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["wincode"] }
solana-keypair = "3"
solana-signer = "3"

[dev-dependencies]
# The write-buffer tests run the writer against a mock JSON-RPC server on a local socket.
tokio = { version = "1.45", features = ["io-util"] }

[profile.release]
overflow-checks = true

[profile.dev]
overflow-checks = true
