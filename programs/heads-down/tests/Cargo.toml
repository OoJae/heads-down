[package]
name = "heads-down-tests"
version = "0.0.1"
edition = "2021"
publish = false
description = "LiteSVM fork suite for heads_down: the live mainnet ORE program + the real secp256r1 / ed25519 precompiles + Token-2022."

[dependencies]
heads-down = { path = "../program", features = ["no-entrypoint"] }
p256-introspect = { path = "../../../crates/p256-introspect", features = ["client"] }
sgt-verify = { path = "../../../crates/sgt-verify", features = ["std"] }
# `precompiles` installs agave-precompiles (ed25519, secp256r1) into LiteSVM.
litesvm = { version = "0.17.0", features = ["precompiles"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
# Versions matched to what litesvm 0.17.0 links against.
solana-account = "4"
solana-address = { version = "2.7", features = ["curve25519", "decode"] }
solana-instruction = "3"
solana-instruction-error = "2"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
solana-transaction-error = "3"
solana-clock = "3"
wincode = "0.6"
# preserve_order: golden vector files keep a readable, stable key order.
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
