# hd-crank on Railway (deploy/railway/crank). Baked into the image at /etc/hd-crank/crank.toml.
# Nothing here is secret: the fee-payer key arrives as HD_CRANK_KEYPAIR_JSON (entrypoint -> tmpfs),
# the Helius key as HELIUS_API_KEY, which hd-crank substitutes for {HELIUS_API_KEY} itself and
# never logs (crank/src/config.rs). A literal api-key= value in this file is refused at start.
# Edit and redeploy to change a knob; HD_CRANK_RPC_URL / HD_CRANK_WS_URL / HD_CRANK_TX_FORMAT and
# HD_CRANK_LISTEN (set from PORT by the entrypoint) override the matching fields.

rpc_url = "https://mainnet.helius-rpc.com/?api-key={HELIUS_API_KEY}"
ws_url = "wss://mainnet.helius-rpc.com/?api-key={HELIUS_API_KEY}"
commitment = "confirmed"
program_id = "HDn4vgLWFLLdexKEwfZwRHjWtizNvdqFteLbMsE67F9p"
listen = "0.0.0.0:8787"            # replaced by HD_CRANK_LISTEN = [::]:$PORT at start
state_dir = "/data/hd-crank"       # the Railway volume: the crank's lookup tables survive redeploys
log_json = true                    # Railway's log explorer parses JSON lines

[dig]
enabled = true
tx_format = "v0"                   # v0 + the crank's own lookup table: 5 fresh heartbeats per tx
deploy_margin_slots = 20
min_slots_left = 3
retry_after_slots = 6
max_attempts_per_round = 2
max_rigs_per_tx = 16
cu_price_micro_lamports = 1000     # priority floor
dynamic_priority_fee = true        # 75th percentile of recent fees on the Board + Round accounts...
priority_fee_percentile = 75
# ...capped. A fresh-heartbeat rig costs ~45k CU; at the cap that is ~2,250 lamports of priority on
# top of ~6,000 of signature fees (v0 batch of 5): at most ~1,250 lamports above crank_fee = 7,000
# during congestion, never more. Raise crank_fee through governance (<= executor_fee = 10,000)
# rather than this cap if congestion persists.
max_cu_price_micro_lamports = 50000
simulate = true
cu_margin_percent = 15
start_rounds = false               # never make the crank's dig the first deploy of a round
checkpoint_sweep = true            # settle idle miners before ORE's 12 h bot window
ore_programdata_slot = 452682055   # ORE upgrade pin (docs/ORE.md): a mismatch trips the breaker
config_poll_secs = 30

[intake]
# Railway's edge sets X-Real-IP to the client's remote address (Railway docs, Networking >
# Specs & Limits). Every per-address limit is keyed on it. After a deploy, check it:
#   curl https://<crank host>/whoami                       -> your own address
#   curl -H 'X-Real-IP: 203.0.113.9' https://<crank host>/whoami   -> still your own address
trust_real_ip = true
# Phones on mobile networks share addresses (carrier NAT), and Railway's CDN path can fold many
# clients into one edge address: allow more than the default 16 connections per address.
max_connections_per_ip = 64
ip_burst = 60
ip_per_second = 4.0

[record]
# A night when the cost gate never opens places no SOL, so no dig carries the phone's heartbeats
# on-chain. Without this the shift would seal with no dark round: no streak day, and a Focus Bond
# would go to the Bury lot although the phone was down all night. The crank pays for these
# records itself (about 6,300 lamports per rig, every `every_rounds` rounds), and this budget
# is the most it can spend on them in an hour (0.024 SOL a day).
gate_closed_rigs = true
max_lamports_per_hour = 1000000

[alt]
enabled = true
auto_create = true
auto_extend = true
max_tables = 8                     # ~500 heartbeating rigs; ~0.00065 SOL of table rent per rig
