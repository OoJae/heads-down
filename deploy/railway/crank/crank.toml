# hd-crank on Railway (deploy/railway/crank). Baked into the image at /etc/hd-crank/crank.toml.
# Nothing here is secret: the fee-payer key arrives as HD_CRANK_KEYPAIR_JSON (entrypoint -> tmpfs),
# the Helius key as HELIUS_API_KEY, which hd-crank substitutes for {HELIUS_API_KEY} itself and
# never logs (crank/src/config.rs). A literal api-key= value in this file is refused at start.
# Edit and redeploy to change a knob, or set HD_CRANK_<SECTION>_<FIELD> on the service: every
# setting has one (`hd-crank config --env` lists them), and it wins over this file.
# HD_CRANK_LISTEN is set from PORT by the entrypoint.
#
# The spend caps of [signals], [end_shift] and [stack] are sized for a fee payer that holds
# 0.05 SOL (50,000,000 lamports): none of them lets its duty use more than about a quarter of
# that in a day (their defaults allow the whole balance). The two that are not: [record] (up to
# 24,000,000 a day) and the lookup table, whose rent grows with every heartbeating rig. Raise
# the caps together with the balance. crank/README.md ("RPC budget") explains the settings
# that decide the RPC use, and .env.example has the overrides for one phone on Helius' free plan.

rpc_url = "https://mainnet.helius-rpc.com/?api-key={HELIUS_API_KEY}"
ws_url = "wss://mainnet.helius-rpc.com/?api-key={HELIUS_API_KEY}"
commitment = "confirmed"
program_id = "HDn4vgLWFLLdexKEwfZwRHjWtizNvdqFteLbMsE67F9p"
listen = "0.0.0.0:8787"            # replaced at start: the entrypoint sets HD_CRANK_LISTEN from PORT
state_dir = "/data/hd-crank"       # the Railway volume: the crank's lookup tables survive redeploys
log_json = true                    # Railway's log explorer parses JSON lines
# The WebSocket delivers every slot; this HTTP poll (2 calls) only covers a stream that has
# stalled. 15 s instead of the default 5 saves about 23,000 calls a day. 20 is the most the
# crank accepts: /healthz calls a slot older than 30 s stale, and a poll may take 10 s.
chain_poll_secs = 15

[dig]
enabled = true
tx_format = "v0"                   # v0 + the crank's own lookup table: 5 fresh heartbeats per tx
deploy_margin_slots = 20
min_slots_left = 3
retry_after_slots = 6
max_attempts_per_round = 2
max_rigs_per_tx = 16
cu_price_micro_lamports = 1000     # priority floor
dynamic_priority_fee = true        # 75th percentile of recent fees on the Board + Round accounts...
priority_fee_percentile = 75
# ...capped. A fresh-heartbeat rig costs ~45k CU; at the cap that is ~2,250 lamports of priority on
# top of ~6,000 of signature fees (v0 batch of 5): at most ~1,250 lamports above crank_fee = 7,000
# during congestion, never more. Raise crank_fee through governance (<= executor_fee = 10,000)
# rather than this cap if congestion persists.
max_cu_price_micro_lamports = 50000
simulate = true
cu_margin_percent = 15
start_rounds = false               # never make the crank's dig the first deploy of a round
checkpoint_sweep = true            # settle idle miners before ORE's 12 h bot window
ore_programdata_slot = 452682055   # ORE upgrade pin (docs/ORE.md): a mismatch trips the breaker
config_poll_secs = 30
# While no heartbeat is held and no known rig has a lease, a dig pass reads nothing; one pass
# in every 10 rounds (about 12 minutes) still does. Only a rig whose heartbeat another crank
# applied waits for that read. 0 = every pass reads (3 scans, up to 3 times a round).
idle_full_read_rounds = 10

[intake]
# Railway's edge sets X-Real-IP to the client's remote address (Railway docs, Networking >
# Specs & Limits). Every per-address limit is keyed on it. After a deploy, check it:
#   curl https://<crank host>/whoami                       -> your own address
#   curl -H 'X-Real-IP: 203.0.113.9' https://<crank host>/whoami   -> still your own address
trust_real_ip = true
# Phones on mobile networks share addresses (carrier NAT), and Railway's CDN path can fold many
# clients into one edge address: allow more than the default 16 connections per address.
max_connections_per_ip = 64
ip_burst = 60
ip_per_second = 4.0

[signals]
# Landing a phone's BREAK or FREEZE costs the crank 10,100 lamports and nothing pays it back.
# 250,000 an hour is 24 of them; the default (2,000,000) could use the whole balance in a day.
max_lamports_per_hour = 250000

[record]
# A night when the cost gate never opens places no SOL, so no dig carries the phone's heartbeats
# on-chain. Without this the shift would seal with no dark round: no streak day, and a Focus Bond
# would go to the Bury lot although the phone was down all night. The crank pays for these
# records itself (about 6,300 lamports per rig, every `every_rounds` rounds), and this budget
# is the most it can spend on them in an hour (0.024 SOL a day).
gate_closed_rigs = true
max_lamports_per_hour = 1000000

[end_shift]
# Sealing a stale shift costs the crank the ShiftLog rent (1,300,480 lamports at today's 5,080
# lamports per byte) plus a fee of about 5,000. The rent goes back to the crank through
# close_shift_log, 30 days after the shift ended; the crank does not send that instruction.
# 6,000,000 a day is 4 shifts; the default (50,000,000) is the whole balance.
max_lamports_per_day = 6000000

[stack]
# Nothing pays the crank back for check-ins: about 6,300 lamports per seat per round, which
# is about 300,000 an hour at today's 75 s rounds. This covers one seat; the default
# (10,000,000 an hour) lets the whole balance go in five hours. Stack is fail-closed: before
# serving more seats, raise this and the balance together.
max_lamports_per_hour = 500000
max_lamports_per_table = 10000000  # 0.01 SOL per table (default 0.1 SOL)
# init_bury_vault stays on: the first settle or forfeit that needs the Bury vault makes the
# crank pay its rent once (3,114,040 lamports at today's rent, never returned).

[alt]
enabled = true
auto_create = true                 # only when the fee payer can pay for it; a failed create is retried after 1 min, 2 min, ... 1 h
auto_extend = true
# One table holds 61 rigs. Its rent comes back only by closing it by hand: 2,560,320 lamports
# with the 10 shared accounts, 650,240 more per rig, 42,550,080 when full. A second table would
# be more than this balance can carry.
max_tables = 1
