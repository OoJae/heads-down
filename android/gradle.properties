org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# MWA clientlib-ktx 2.0.3 (pinned by the build plan) and clientlib 2.0.3 both declare the
# namespace com.solana.mobilewalletadapter.clientlib, which AGP 9 rejects by default.
# Neither ships resources, so the shared R package is empty. clientlib-ktx 2.2.0 renames its
# namespace to ...clientlib.ktx; drop this line when upgrading (AGP 10 removes the option).
android.uniquePackageNames=false
