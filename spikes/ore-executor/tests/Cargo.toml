[package]
name = "hd-spike-tests"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
litesvm = { version = "0.17.0", features = ["precompiles"] }
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
solana-instruction = "3"
solana-address = { version = "2.7", features = ["curve25519", "decode"] }
solana-account = "4"
solana-message = "4"
solana-system-interface = { version = "2", features = ["bincode"] }
serde_json = "1"
base64 = "0.22"
